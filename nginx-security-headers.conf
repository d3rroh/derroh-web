# Baseline security headers. `always` so error responses get them too.
# Included by every block that sets headers: an add_header in a location
# drops all the ones inherited from the server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore this over plain HTTP, so it only takes effect via Cloudflare's HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP. Inline code is allowed only by hash; scripts/check_csp.js fails the
# Docker build if a page's inline <script> or on*="" handler isn't listed:
#   sha256-bJnam…  index.html <head> boot-skip snippet
#   sha256-/F/No…  404.html path snippet
#   sha256-1jAmy…  onload="this.onload=null;this.rel='stylesheet'" (font preload)
# three.js is pinned to one cdnjs URL and also checked with SRI in home.js.
# style-src keeps 'unsafe-inline': the pages and JS templates use style="".
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-bJnam/TO/yQebssEtbvBVQkHaMRVw7yaPm270uwYK/8=' 'sha256-/F/No/YP1In1UQBxuzvbsPAYN4iQ7q7CqCC87aUX6i8=' 'unsafe-hashes' 'sha256-1jAmyYXcRq6zFldLe/GCgIDJBiOONdXjTLgEFMDnDSM=' https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
