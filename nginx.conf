# CSS/JS/fonts carry a ?v=<content hash> stamped at build time
# (scripts/build_assets.sh), so a stamped URL never changes content.
map $arg_v $asset_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    location = /api/contact {
        limit_except POST { deny all; }
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The contact server rate-limits on CF-Connecting-IP (Cloudflare)
        # or X-Real-IP — never on X-Forwarded-For, which clients can forge.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location = /api/csrf-token {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML: always revalidate (cheap 304 via ETag) so deploys show up at once.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|woff2?)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control $asset_cache_control;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Text files are pre-gzipped at build time; serve those directly and
    # compress anything else on the fly.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml image/x-icon;
}
