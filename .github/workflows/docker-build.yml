name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The deploy step runs only once this secret exists (base64 kubeconfig
      # for the k3s cluster); until then the workflow just builds and pushes.
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG_B64 != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Writes data/stats.json and bakes the values into index.html. If it
      # fails, the build carries on and those panels stay hidden.
      - name: Generate GitHub stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: d3rroh/derroh-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to k3s
        if: github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n derroh-web set image deployment/derroh-web derroh-web=d3rroh/derroh-web:${{ github.sha }}
          kubectl -n derroh-web rollout status deployment/derroh-web --timeout=120s
