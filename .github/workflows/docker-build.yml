name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The deploy step runs only once this secret exists (base64 kubeconfig
      # for the k3s cluster); until then the workflow just builds and pushes.
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG_B64 != '' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Writes data/stats.json and bakes the values into index.html. If it
      # fails, the build carries on and those panels stay hidden.
      - name: Generate GitHub stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: d3rroh/derroh-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.sha }}

      # Build into the local daemon first and scan it; nothing is pushed if
      # the image has a fixable HIGH/CRITICAL vulnerability.
      - name: Build for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: derroh-web:scan
          cache-from: type=gha

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: derroh-web:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to k3s
        if: github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl -n derroh-web set image deployment/derroh-web web=d3rroh/derroh-web:${{ github.sha }}
          kubectl -n derroh-web rollout status deployment/derroh-web --timeout=120s
